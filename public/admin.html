<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Student Friendly</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .box { max-width: 1100px; margin: 40px auto; background: #1e293b; border-radius: 10px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0 20px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #334155; color: #38bdf8; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cv-text { max-height: 120px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #0f172a; padding: 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="box" style="max-width: 400px; margin-top: 100px;">
    <h2>Admin Login</h2>
    <p style="color: #94a3b8; font-size: 14px;">Enter your admin ID and password</p>
    <div id="login-err" style="color: #ef4444; margin-bottom: 12px; font-weight: bold;"></div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <label>Admin ID</label>
      <input type="text" id="username" value="SFUK" required>
      
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••••••" required>
      
      <button type="submit" id="loginBtn" style="width: 100%;">Sign In</button>
    </form>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="box hidden">
    <div class="top-bar">
      <h2>Registered Students</h2>
      <div>
        <button id="downloadBtn" onclick="downloadJSON()" style="background: #10b981;">Download All (JSON)</button>
        <button id="logoutBtn" onclick="logout()" style="background: #ef4444; margin-left: 8px;">Logout</button>
      </div>
    </div>
    
    <div style="overflow-x: auto;">
      <table id="studentsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Job Field</th>
            <th>LinkedIn</th>
            <th style="min-width: 250px;">Generated CV</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let globalData = [];

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errBox = document.getElementById('login-err');
      errBox.innerText = 'Checking credentials...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          errBox.innerText = '';
          sessionStorage.setItem('adminToken', data.token);
          loadDashboard();
        } else {
          errBox.innerText = data.error || 'Invalid credentials';
        }
      } catch (err) {
        errBox.innerText = 'Server error during login';
      }
    }

    async function loadDashboard() {
      const token = sessionStorage.getItem('adminToken');
      if (!token) return;

      try {
        const res = await fetch('/api/admin/data', {
          headers: { 'x-admin-token': token }
        });

        if (!res.ok) {
          logout();
          return;
        }

        globalData = await res.json();
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (globalData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #94a3b8;">No registered students yet.</td></tr>';
          return;
        }

        globalData.forEach(s => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${s.name || '-'}</strong></td>
            <td>${s.email || '-'}</td>
            <td>${s.phone || '-'}</td>
            <td>${s.course || '-'}</td>
            <td>${s.job_field || '-'}</td>
            <td>${s.linkedin && s.linkedin !== 'Not provided' ? `<a href="${s.linkedin}" target="_blank" style="color: #38bdf8;">Profile</a>` : 'None'}</td>
            <td>${s.generated_cv && s.generated_cv !== 'Not generated yet' ? `<div class="cv-text">${s.generated_cv}</div>` : '<span style="color: #94a3b8;">Not generated yet</span>'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        alert('Failed to load data from server.');
      }
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(globalData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'students-master-export.json';
      a.click();
    }

    function logout() {
      sessionStorage.removeItem('adminToken');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    if (sessionStorage.getItem('adminToken')) {
      loadDashboard();
    }
  </script>
</body>
</html>
